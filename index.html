<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="HVAC·R" />
    <title>HVAC·R Rechner</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0..200&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var root = document.documentElement;
        var savedTheme = null;
        try {
          savedTheme = localStorage.getItem("ag-theme");
        } catch (e) {}
        var systemPrefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
        var activeTheme =
          savedTheme === "light" || savedTheme === "dark" ? savedTheme : systemPrefersLight ? "light" : "dark";
        root.setAttribute("data-theme", activeTheme);
        root.style.transform = "translateZ(0)";
        void root.offsetHeight;
        root.style.transform = "";
        window.scrollTo(0, 0);
      })();
    </script>
    <script type="module" src="./assets/js/shared.js" blocking="render"></script>
    <link rel="stylesheet" href="./assets/css/global.css" />
    <script type="module" src="./assets/js/dashboard.js" blocking="render"></script>
  </head>
  <body>
    <div class="ambient-canvas" aria-hidden="true">
      <div class="ambient-blob ambient-blob--cyan"></div>
      <div class="ambient-blob ambient-blob--purple"></div>
    </div>

    <main class="app-shell">
      <section id="hero-home" class="view-stack" aria-label="HVAC·R Übersicht">
        <header class="app-header">
          <div class="hero-nav-left">
            <h1 class="brand-title">
              <span class="material-symbols-rounded" style="color: var(--system-cyan);" aria-hidden="true">thermostat_auto</span>
              <span>HVAC·R Rechner</span>
            </h1>
          </div>
          <div class="top-actions no-print">
            <button
              type="button"
              id="themeToggleBtn"
              class="icon-btn press-icon"
              aria-label="Designmodus wechseln (Hell / Dunkel)"
              title="Hell / Dunkel wechseln"
            >
              <span class="material-symbols-rounded" id="themeToggleIcon" aria-hidden="true">light_mode</span>
            </button>
            <button
              type="button"
              id="settings-toggle-btn"
              class="icon-btn settings-btn press-icon"
              aria-label="Einstellungen öffnen"
              title="Einstellungen"
            >
              <span class="material-symbols-rounded" aria-hidden="true">settings</span>
            </button>
          </div>
        </header>
        <p class="hero-sub">Berechnung, Kennlinien und Auslegung – alles an einem Ort.</p>

        <div class="liquid-glass glass-card" style="padding: 0.75rem;">
          <label class="liquid-surface-inner input-wrapper" for="hub-search">
            <span class="material-symbols-rounded" style="color: var(--system-cyan);" aria-hidden="true">search</span>
            <input
              id="hub-search"
              class="glass-input"
              type="search"
              placeholder="App suchen …"
              aria-label="Rechner durchsuchen"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              enterkeyhint="search"
            />
          </label>
        </div>
      </section>

      <!-- Kompakte Top-Leiste (nur in der Einstellungen-Ansicht sichtbar) -->
      <header id="top-bar" class="app-header" hidden>
        <div class="hero-nav-left">
          <button
            type="button"
            id="nav-back-btn"
            class="back-btn press-btn no-print"
            aria-label="Zurück zur Übersicht"
          >
            <span class="material-symbols-rounded" aria-hidden="true">arrow_back_ios_new</span>
            <span>Übersicht</span>
          </button>
          <h1 class="brand-title">
            <span class="material-symbols-rounded" style="color: var(--system-cyan);" aria-hidden="true">tune</span>
            <span id="brand-title">Einstellungen</span>
          </h1>
        </div>
      </header>

      <!-- DASHBOARD / APP-LAUNCHER -->
      <section id="view-home" class="view-stack calc-panel" aria-label="Rechner-Übersicht">
        <div id="hub-grid" class="dashboard-grid hub-grid" role="list"></div>
        <div id="hub-empty" class="liquid-glass glass-card empty-state" hidden>
          Kein passender Rechner gefunden.
        </div>
      </section>

      <!-- EINSTELLUNGEN-ANSICHT -->
      <section id="view-settings" class="liquid-glass glass-card calc-panel" aria-label="Einstellungen" hidden>
        <div class="liquid-surface-inner well">
          <div class="well-header">
            <span class="well-label">Darstellung</span>
            <span class="well-hint">Dual-Theme (Hell / Dunkel)</span>
          </div>
          <div id="theme-mode-group" class="settings-segmented" role="radiogroup" aria-label="Darstellungsmodus">
            <button type="button" class="settings-seg-btn press-btn" role="radio" data-theme-mode="auto" aria-checked="true">Auto</button>
            <button type="button" class="settings-seg-btn press-btn" role="radio" data-theme-mode="light" aria-checked="false">Hell</button>
            <button type="button" class="settings-seg-btn press-btn" role="radio" data-theme-mode="dark" aria-checked="false">Dunkel</button>
          </div>
        </div>

        <div class="liquid-surface-inner well">
          <div class="well-header">
            <span class="well-label">App-Info & Updates</span>
            <span class="status-pill status-pill--success" id="app-status-pill">
              <span class="status-dot"></span>
              <span>Aktuell</span>
            </span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.85rem; font-size: var(--text-sub);">
            <div style="display: flex; justify-content: space-between; color: var(--text-secondary);">
              <span>Installierte Version:</span>
              <strong id="app-version-label" class="numeric" style="font-family: var(--font-mono); color: var(--text-primary);">v1.2.1</strong>
            </div>
            <div style="display: flex; justify-content: space-between; color: var(--text-secondary);">
              <span>Build-Datum:</span>
              <span id="app-build-date" class="numeric" style="font-family: var(--font-mono); color: var(--text-primary);">2026-11-15</span>
            </div>
          </div>
          <div class="settings-actions-stack">
            <button type="button" id="check-update-btn" class="update-check-btn press-btn">
              <span class="material-symbols-rounded" aria-hidden="true">sync</span>
              <span>Nach Updates suchen</span>
            </button>
            <button type="button" id="force-cache-reset-btn" class="update-check-btn update-check-btn--secondary press-btn">
              <span class="material-symbols-rounded" aria-hidden="true">cleaning_services</span>
              <span>Update erzwingen / Cache leeren</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <nav class="liquid-glass floating-nav no-print" aria-label="Hauptnavigation">
      <button type="button" class="nav-item active" data-nav-action="home" aria-label="Übersicht">
        <span class="material-symbols-rounded is-active" aria-hidden="true">grid_view</span>
        <span class="nav-label">Übersicht</span>
      </button>
      <button type="button" class="nav-item" data-nav-action="settings" aria-label="Einstellungen">
        <span class="material-symbols-rounded" aria-hidden="true">tune</span>
        <span class="nav-label">Einstellungen</span>
      </button>
    </nav>

    <div id="toast-pill" class="toast-pill" role="status" aria-live="polite" data-visible="false"></div>
  </body>
</html>
