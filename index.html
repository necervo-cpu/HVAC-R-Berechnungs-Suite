<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="HVAC·R" />
    <title>HVAC·R Rechner</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var mode = window.localStorage.getItem("hvacr-theme-mode");
          if (mode === "light" || mode === "dark") {
            root.setAttribute("data-theme", mode);
          }
        } catch (e) {}
        root.style.transform = "translateZ(0)";
        void root.offsetHeight;
        root.style.transform = "";
        window.scrollTo(0, 0);
      })();
    </script>
    <script type="module" src="./assets/js/shared.js" blocking="render"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="./assets/css/global.css" />
    <script type="module" src="./assets/js/dashboard.js" blocking="render"></script>
  </head>
  <body>
    <header id="hero-home" class="hero">
      <div class="hero-in">
        <div class="hero-top">
          <div class="hero-tt">
            <h1>HVAC·R Rechner</h1>
            <p class="hero-sub">Berechnung, Kennlinien und Auslegung – alles an einem Ort.</p>
          </div>
          <button
            type="button"
            id="settings-toggle-btn"
            class="settings-btn hero-action-btn press-icon"
            aria-label="Einstellungen öffnen"
          >
            <span class="ag-icon ag-icon--sm" aria-hidden="true">settings</span>
          </button>
        </div>

        <label class="hero-search">
          <span class="ag-icon ag-icon--sm" aria-hidden="true">search</span>
          <input
            id="hub-search"
            type="search"
            placeholder="App suchen …"
            aria-label="Rechner durchsuchen"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="search"
          />
        </label>
      </div>
    </header>

    <main class="app-shell">
      <!-- Kompakte Top-Leiste (nur in der Einstellungen-Ansicht sichtbar) -->
      <header id="top-bar" class="top-bar" hidden>
        <div class="brand-mark">
          <button
            type="button"
            id="nav-back-btn"
            class="back-btn press-btn"
            aria-label="Zurück zur Übersicht"
          >
            <span class="ag-icon ag-icon--xs" aria-hidden="true">arrow_back_ios_new</span>
            <span>Übersicht</span>
          </button>
          <span id="brand-title" class="brand-title">Einstellungen</span>
        </div>
      </header>

      <!-- DASHBOARD / APP-LAUNCHER -->
      <section id="view-home" class="view-stack calc-panel" aria-label="Rechner-Übersicht">
        <div id="hub-grid" class="hub-grid" role="list"></div>
        <div id="hub-empty" class="liquid-glass-card empty-state" hidden>
          Kein passender Rechner gefunden.
        </div>
      </section>

      <!-- EINSTELLUNGEN-ANSICHT -->
      <section id="view-settings" class="liquid-glass-card calc-panel" aria-label="Einstellungen" hidden>
        <div class="well">
          <div class="well-header">
            <span class="well-label">Darstellung</span>
          </div>
          <div id="theme-mode-group" class="settings-segmented" role="radiogroup" aria-label="Darstellungsmodus">
            <button type="button" class="settings-seg-btn press-btn" role="radio" data-theme-mode="auto" aria-checked="true">Auto</button>
            <button type="button" class="settings-seg-btn press-btn" role="radio" data-theme-mode="light" aria-checked="false">Hell</button>
            <button type="button" class="settings-seg-btn press-btn" role="radio" data-theme-mode="dark" aria-checked="false">Dunkel</button>
          </div>
        </div>

        <div class="well">
          <div class="well-header">
            <span class="well-label">App-Version</span>
            <span id="app-version-label" class="well-hint">v1.1.0</span>
          </div>
          <button type="button" id="check-update-btn" class="update-check-btn press-btn">
            <span class="ag-icon ag-icon--sm" aria-hidden="true">refresh</span>
            <span>Auf Updates prüfen</span>
          </button>
        </div>
      </section>
    </main>

    <div id="toast-pill" class="toast-pill" role="status" aria-live="polite" data-visible="false"></div>
  </body>
</html>
