<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#18181b" />
    <title>HVAC·R – Design-Vorlage (Minimalistisches Grau)</title>
    <!--
      Modul: Standalone-Design-Vorlage „Monochrom Graphit“ (design-vorlage.html)
      Zweck: Interaktive Vorschau des neuen minimalistischen Grau-Designs im Dark Mode
        (inkl. 3-Stufen-Theme Dunkel/Hell/Auto) nach Apple HIG & Liquid Glass.
      Verantwortlichkeit: Zeigt Startseite (Rechner-Übersicht) und einen funktionalen
        NTC/PTC-Sensor-Rechner als direkt testbare HTML-Vorlage.
      Sicherheits- & A11y-Relevanz: Keine externen CDNs/Fonts (DSGVO-konform),
        keine unsicheren DOM-Injektionen, vollständige Reduced-Motion/Transparency-Fallbacks.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        root.style.transform = "translateZ(0)";
        void root.offsetHeight;
        root.style.transform = "";
        window.scrollTo(0, 0);
      })();
    </script>
    <style>
      /* ========================================================================
         1. DESIGN-TOKENS: MONOCHROM GRAPHIT (Dark-First Grau & Light-Fallback)
         ======================================================================== */
      :root,
      :root[data-theme="dark"] {
        color-scheme: dark;

        /* Reines, abgestuftes Neutral-Grau (Zinc/Graphit-Skala) + Signal-Orange Akzent */
        --bg: #18181b;
        --ios-bg:
          radial-gradient(circle at 16% 6%, rgba(255, 107, 44, 0.06), transparent 42%),
          radial-gradient(circle at 84% 86%, rgba(161, 161, 170, 0.045), transparent 50%),
          #18181b;

        --glass: rgba(36, 36, 40, 0.74);
        --glass-hover: rgba(44, 44, 49, 0.84);
        --glass-hero: rgba(28, 28, 32, 0.86);
        --input-bg: rgba(22, 22, 25, 0.72);
        --pill-track: rgba(255, 255, 255, 0.06);
        --pill-thumb: rgba(72, 72, 79, 0.92);

        --edge: rgba(255, 255, 255, 0.13);
        --edge-low: rgba(0, 0, 0, 0.36);
        --border-subtle: rgba(255, 255, 255, 0.08);
        --ios-shadow:
          0 16px 40px -12px rgba(0, 0, 0, 0.55),
          0 2px 8px -2px rgba(0, 0, 0, 0.35);

        --ink: #f4f4f5;
        --ink-strong: #ffffff;
        --muted: #a1a1aa;
        --muted-soft: #71717a;

        /* Viraler Minimalismus-Akzent: Signal-Orange (Dieter Rams / Teenage Engineering / Ultra) */
        --accent: #ff6b2c;
        --accent-soft: rgba(255, 107, 44, 0.14);
        --accent-border: rgba(255, 107, 44, 0.38);
        --accent-glow: 0 0 12px rgba(255, 107, 44, 0.55);
        --accent-ink: #18181b;
        --tile: rgba(255, 255, 255, 0.07);
        --badge-bg: rgba(255, 255, 255, 0.08);
      }

      :root[data-theme="light"] {
        color-scheme: light;

        --bg: #f2f2f4;
        --ios-bg:
          radial-gradient(circle at 14% 8%, rgba(232, 84, 24, 0.05), transparent 44%),
          radial-gradient(circle at 86% 84%, rgba(113, 113, 122, 0.05), transparent 50%),
          #f2f2f4;

        --glass: rgba(255, 255, 255, 0.78);
        --glass-hover: rgba(255, 255, 255, 0.92);
        --glass-hero: rgba(255, 255, 255, 0.88);
        --input-bg: rgba(244, 244, 246, 0.8);
        --pill-track: rgba(24, 24, 27, 0.06);
        --pill-thumb: rgba(255, 255, 255, 0.96);

        --edge: rgba(255, 255, 255, 0.95);
        --edge-low: rgba(24, 24, 27, 0.06);
        --border-subtle: rgba(24, 24, 27, 0.08);
        --ios-shadow:
          0 12px 32px -10px rgba(24, 24, 27, 0.08),
          0 2px 6px -1px rgba(24, 24, 27, 0.04);

        --ink: #18181b;
        --ink-strong: #09090b;
        --muted: #52525b;
        --muted-soft: #71717a;

        --accent: #e85418;
        --accent-soft: rgba(232, 84, 24, 0.11);
        --accent-border: rgba(232, 84, 24, 0.35);
        --accent-glow: 0 0 8px rgba(232, 84, 24, 0.35);
        --accent-ink: #fafafa;
        --tile: rgba(24, 24, 27, 0.06);
        --badge-bg: rgba(24, 24, 27, 0.06);
      }

      @media (prefers-color-scheme: light) {
        :root:not([data-theme]) {
          color-scheme: light;
          --bg: #f2f2f4;
          --ios-bg:
            radial-gradient(circle at 14% 8%, rgba(232, 84, 24, 0.05), transparent 44%),
            radial-gradient(circle at 86% 84%, rgba(113, 113, 122, 0.05), transparent 50%),
            #f2f2f4;
          --glass: rgba(255, 255, 255, 0.78);
          --glass-hover: rgba(255, 255, 255, 0.92);
          --glass-hero: rgba(255, 255, 255, 0.88);
          --input-bg: rgba(244, 244, 246, 0.8);
          --pill-track: rgba(24, 24, 27, 0.06);
          --pill-thumb: rgba(255, 255, 255, 0.96);
          --edge: rgba(255, 255, 255, 0.95);
          --edge-low: rgba(24, 24, 27, 0.06);
          --border-subtle: rgba(24, 24, 27, 0.08);
          --ios-shadow:
            0 12px 32px -10px rgba(24, 24, 27, 0.08),
            0 2px 6px -1px rgba(24, 24, 27, 0.04);
          --ink: #18181b;
          --ink-strong: #09090b;
          --muted: #52525b;
          --muted-soft: #71717a;
          --accent: #e85418;
          --accent-soft: rgba(232, 84, 24, 0.11);
          --accent-border: rgba(232, 84, 24, 0.35);
          --accent-glow: 0 0 8px rgba(232, 84, 24, 0.35);
          --accent-ink: #fafafa;
          --tile: rgba(24, 24, 27, 0.06);
          --badge-bg: rgba(24, 24, 27, 0.06);
        }
      }

      :root {
        --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", sans-serif;
        --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
        --font-mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

        --radius-hero: 28px;
        --radius-card: 24px;
        --radius-well: 14px;
        --radius-control: 11px;

        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --dur-fast: 150ms;
        --dur-normal: 240ms;
      }

      /* ========================================================================
         2. BASIS & iOS-PWA-SAFE-AREA
         ======================================================================== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior-y: none;
        background: var(--bg);
        height: 100%;
        font-family: var(--font-sans);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background: var(--ios-bg);
        pointer-events: none;
      }

      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: transparent;
        color: var(--ink);
        line-height: 1.45;
        overflow-wrap: break-word;
        hyphens: auto;
      }

      .app-shell {
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding:
          max(12px, env(safe-area-inset-top))
          max(16px, env(safe-area-inset-right))
          max(32px, env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-left));
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* ========================================================================
         3. SCHLANKE TOP-LEISTE (44px)
         ======================================================================== */
      .top-bar {
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 4px 2px;
      }

      .brand-mark {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: var(--accent-glow);
        flex-shrink: 0;
      }

      .brand-title {
        font-family: var(--font-display);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--ink-strong);
      }

      .preview-tag {
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        background: var(--badge-bg);
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid var(--border-subtle);
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      /* ========================================================================
         4. LIQUID GLASS KARTEN & BUTTONS
         ======================================================================== */
      .glass-card {
        background: var(--glass);
        backdrop-filter: blur(20px) saturate(140%);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-card);
        box-shadow:
          inset 0 1px 1px 0 var(--edge),
          inset 0 -1px 0 0 var(--edge-low),
          var(--ios-shadow);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
      }

      .glass-btn {
        appearance: none;
        border: 1px solid var(--border-subtle);
        background: var(--glass);
        color: var(--ink);
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        min-height: 44px;
        padding: 0 14px;
        border-radius: var(--radius-control);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        cursor: pointer;
        box-shadow: inset 0 1px 0 0 var(--edge);
        transition:
          transform var(--dur-fast) var(--ease-out),
          background-color var(--dur-fast) var(--ease-out);
      }

      .glass-btn:hover {
        background: var(--glass-hover);
      }

      .press-btn:active {
        transform: scale(0.97);
      }

      .press-card:active {
        transform: scale(0.99);
      }

      /* ========================================================================
         5. SUCHE & SEGMENTED FILTER (Minimalistisch)
         ======================================================================== */
      .search-well {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--input-bg);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-well);
        padding: 0 14px;
        min-height: 46px;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.14);
        transition: border-color var(--dur-fast) var(--ease-out);
      }

      .search-well:focus-within {
        border-color: var(--accent-border);
      }

      .search-well svg {
        color: var(--muted-soft);
        flex-shrink: 0;
      }

      .search-input {
        width: 100%;
        min-width: 0;
        border: 0;
        background: transparent;
        color: var(--ink);
        font-family: inherit;
        font-size: 16px;
        outline: none;
      }

      .search-input::placeholder {
        color: var(--muted-soft);
      }

      .segmented {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        background: var(--pill-track);
        border: 1px solid var(--border-subtle);
        border-radius: 13px;
        padding: 3px;
        gap: 3px;
      }

      .seg-btn {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        min-height: 38px;
        padding: 6px 10px;
        border-radius: 10px;
        cursor: pointer;
        transition:
          background-color var(--dur-fast) var(--ease-out),
          color var(--dur-fast) var(--ease-out),
          transform var(--dur-fast) var(--ease-out);
      }

      .seg-btn[aria-selected="true"] {
        background: var(--pill-thumb);
        color: var(--ink-strong);
        box-shadow:
          inset 0 1px 0 0 var(--edge),
          0 2px 6px rgba(0, 0, 0, 0.2);
      }

      /* ========================================================================
         6. RECHNER-GRID (Hub)
         ======================================================================== */
      .hub-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      @media (max-width: 540px) {
        .hub-grid {
          grid-template-columns: 1fr;
        }
      }

      .hub-tile {
        appearance: none;
        text-align: left;
        width: 100%;
        background: var(--glass);
        backdrop-filter: blur(20px) saturate(140%);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-card);
        padding: 16px 18px;
        box-shadow:
          inset 0 1px 1px 0 var(--edge),
          inset 0 -1px 0 0 var(--edge-low),
          var(--ios-shadow);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 12px;
        min-height: 108px;
        min-width: 0;
        cursor: pointer;
        color: var(--ink);
        font-family: inherit;
        transition:
          transform var(--dur-fast) var(--ease-out),
          background-color var(--dur-fast) var(--ease-out);
      }

      .hub-tile:hover {
        background: var(--glass-hover);
        border-color: var(--accent-border);
      }

      .hub-tile:hover .hub-arrow {
        color: var(--accent);
      }

      .hub-tile-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-width: 0;
      }

      .hub-cat {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        background: var(--tile);
        padding: 3px 8px;
        border-radius: 7px;
      }

      .hub-arrow {
        color: var(--muted-soft);
        flex-shrink: 0;
      }

      .hub-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.015em;
        color: var(--ink-strong);
      }

      .hub-sub {
        margin: 3px 0 0;
        font-size: 13px;
        color: var(--muted);
      }

      /* ========================================================================
         7. RECHNER-DETAIL-ANSICHT (NTC/PTC)
         ======================================================================== */
      .field-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }

      .field-label {
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 0.01em;
      }

      .input-well {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--input-bg);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-well);
        padding: 6px 14px;
        min-height: 52px;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.16);
        transition: border-color var(--dur-fast) var(--ease-out);
      }

      .input-well:focus-within {
        border-color: var(--accent-border);
      }

      .num-input {
        width: 100%;
        min-width: 0;
        border: 0;
        background: transparent;
        color: var(--ink-strong);
        font-family: var(--font-mono);
        font-size: 20px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        outline: none;
      }

      .unit-tag {
        font-family: var(--font-mono);
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
        flex-shrink: 0;
      }

      .preset-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip-btn {
        appearance: none;
        border: 1px solid var(--border-subtle);
        background: var(--tile);
        color: var(--ink);
        font-family: var(--font-mono);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        min-height: 44px;
        padding: 0 14px;
        border-radius: var(--radius-control);
        cursor: pointer;
        transition:
          background-color var(--dur-fast) var(--ease-out),
          transform var(--dur-fast) var(--ease-out);
      }

      .chip-btn:hover {
        background: var(--accent-soft);
        border-color: var(--accent-border);
        color: var(--accent);
      }

      .result-hero {
        background: var(--glass-hero);
        backdrop-filter: blur(26px) saturate(150%);
        -webkit-backdrop-filter: blur(26px) saturate(150%);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-hero);
        padding: 22px 20px;
        box-shadow:
          inset 0 1px 1px 0 var(--edge),
          inset 0 -1px 0 0 var(--edge-low),
          var(--ios-shadow);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .result-caption {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--accent);
      }

      .result-value {
        font-family: var(--font-mono);
        font-size: clamp(32px, 6vw, 42px);
        font-weight: 600;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
        color: var(--ink-strong);
        line-height: 1.1;
      }

      .result-meta {
        font-size: 13px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .empty-state {
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        padding: 28px 18px;
      }

      [hidden] {
        display: none !important;
      }

      /* ========================================================================
         8. BARRIEREFREIHEIT & SYSTEM-RESPEKT
         ======================================================================== */
      @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
        .glass-card,
        .hub-tile,
        .result-hero,
        .glass-btn {
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
          background: #27272a;
        }
        :root[data-theme="light"] .glass-card,
        :root[data-theme="light"] .hub-tile,
        :root[data-theme="light"] .result-hero,
        :root[data-theme="light"] .glass-btn {
          background: #ffffff;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.001ms !important;
          animation-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <!-- Kompakte Top-Leiste (44px) -->
      <header class="top-bar">
        <div class="brand-mark">
          <button
            type="button"
            id="btn-back"
            class="glass-btn press-btn"
            hidden
            aria-label="Zurück zur Übersicht"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span>Übersicht</span>
          </button>
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="brand-title">HVAC·R</span>
          <span class="preview-tag">Graphit · Signal-Orange</span>
        </div>

        <div class="top-actions">
          <button
            type="button"
            id="btn-theme"
            class="glass-btn press-btn"
            aria-label="Darstellungsmodus wechseln"
          >
            <span id="theme-label">Dunkel</span>
          </button>
        </div>
      </header>

      <!-- ANSICHT 1: STARTSEITE / ÜBERSICHT -->
      <section id="view-hub" aria-label="Rechner-Übersicht" style="display: flex; flex-direction: column; gap: 14px;">
        <div class="glass-card">
          <div class="search-well">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              id="hub-search"
              class="search-input"
              type="search"
              placeholder="Rechner suchen (z. B. NTC, Taupunkt)…"
              aria-label="Rechner durchsuchen"
            />
          </div>

          <div class="segmented" role="tablist" aria-label="Kategorie wählen" id="cat-tabs">
            <button type="button" class="seg-btn press-btn" role="tab" data-cat="all" aria-selected="true">Alle</button>
            <button type="button" class="seg-btn press-btn" role="tab" data-cat="kaelte" aria-selected="false">Kälte</button>
            <button type="button" class="seg-btn press-btn" role="tab" data-cat="klima" aria-selected="false">Lüftung</button>
            <button type="button" class="seg-btn press-btn" role="tab" data-cat="heizung" aria-selected="false">Heizung</button>
          </div>
        </div>

        <div id="hub-grid" class="hub-grid" role="list"></div>
        <div id="hub-empty" class="glass-card empty-state" hidden>
          Kein passender Rechner gefunden.
        </div>
      </section>

      <!-- ANSICHT 2: BEISPIEL-RECHNER (NTC 10k B3950) -->
      <section id="view-calc" hidden aria-label="NTC Sensor-Rechner" style="display: flex; flex-direction: column; gap: 14px;">
        <div class="result-hero">
          <span class="result-caption" id="res-caption">Berechnete Temperatur</span>
          <div class="result-value" id="res-value">25,0 °C</div>
          <div class="result-meta" id="res-meta">NTC 10 kΩ · B = 3950 K · 10.000 Ω</div>
        </div>

        <div class="glass-card">
          <div class="segmented" role="tablist" aria-label="Umrechnungsrichtung" id="dir-tabs">
            <button type="button" class="seg-btn press-btn" role="tab" data-dir="ohmToTemp" aria-selected="true">Ohm → °C</button>
            <button type="button" class="seg-btn press-btn" role="tab" data-dir="tempToOhm" aria-selected="false">°C → Ohm</button>
          </div>

          <div class="field-group">
            <label for="calc-input" class="field-label" id="input-label">Gemessener Widerstand (Ω)</label>
            <div class="input-well">
              <input
                id="calc-input"
                class="num-input"
                type="number"
                inputmode="decimal"
                step="any"
                value="10000"
              />
              <span class="unit-tag" id="input-unit">Ω</span>
            </div>
          </div>

          <div class="preset-row" id="preset-row" aria-label="Schnellwerte"></div>
        </div>
      </section>
    </main>

    <script>
      (function () {
        "use strict";

        // 1. 3-Stufen-Theme (Dunkel -> Hell -> Auto)
        var modes = ["dark", "light", "auto"];
        var labels = { dark: "Dunkel", light: "Hell", auto: "Auto" };
        var modeIndex = 0;
        var btnTheme = document.getElementById("btn-theme");
        var themeLabel = document.getElementById("theme-label");

        btnTheme.addEventListener("click", function () {
          modeIndex = (modeIndex + 1) % modes.length;
          var next = modes[modeIndex];
          if (next === "auto") {
            document.documentElement.removeAttribute("data-theme");
          } else {
            document.documentElement.setAttribute("data-theme", next);
          }
          themeLabel.textContent = labels[next];
        });

        // 2. Hub-Daten (HVAC-R Rechner)
        var tools = [
          { id: "sensor", cat: "kaelte", catLabel: "Kälte", title: "NTC & PTC Fühler", sub: "Widerstand ↔ Temperatur (10k, PT1000)" },
          { id: "superheat", cat: "kaelte", catLabel: "Kälte", title: "Überhitzung", sub: "Saugdruck & Sauggastemperatur" },
          { id: "airflow", cat: "klima", catLabel: "Lüftung", title: "Luftvolumenstrom", sub: "Querschnitt, Geschwindigkeit & m³/h" },
          { id: "dewpoint", cat: "klima", catLabel: "Lüftung", title: "Taupunkt & Feuchte", sub: "Relative Feuchte & Kondensationspunkt" },
          { id: "hydronic", cat: "heizung", catLabel: "Heizung", title: "Heizleistung (ΔT)", sub: "Massenstrom, Spreizung & kW" },
          { id: "pressure", cat: "heizung", catLabel: "Heizung", title: "Ausdehnungsgefäß", sub: "Anlagenvolumen & Vordruck" }
        ];

        var activeCat = "all";
        var searchInput = document.getElementById("hub-search");
        var hubGrid = document.getElementById("hub-grid");
        var hubEmpty = document.getElementById("hub-empty");
        var viewHub = document.getElementById("view-hub");
        var viewCalc = document.getElementById("view-calc");
        var btnBack = document.getElementById("btn-back");

        function renderHub() {
          var q = searchInput.value.trim().toLowerCase();
          var filtered = tools.filter(function (t) {
            var catOk = activeCat === "all" || t.cat === activeCat;
            var qOk = !q || t.title.toLowerCase().indexOf(q) !== -1 || t.sub.toLowerCase().indexOf(q) !== -1;
            return catOk && qOk;
          });

          hubGrid.replaceChildren();
          hubEmpty.hidden = filtered.length > 0;

          filtered.forEach(function (tool) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "hub-tile press-card";
            btn.setAttribute("role", "listitem");

            var top = document.createElement("div");
            top.className = "hub-tile-top";

            var badge = document.createElement("span");
            badge.className = "hub-cat";
            badge.textContent = tool.catLabel;

            var arrow = document.createElement("span");
            arrow.className = "hub-arrow";
            arrow.textContent = "→";

            top.appendChild(badge);
            top.appendChild(arrow);

            var body = document.createElement("div");
            var h = document.createElement("h2");
            h.className = "hub-title";
            h.textContent = tool.title;

            var p = document.createElement("p");
            p.className = "hub-sub";
            p.textContent = tool.sub;

            body.appendChild(h);
            body.appendChild(p);

            btn.appendChild(top);
            btn.appendChild(body);

            btn.addEventListener("click", function () {
              openCalc();
            });
            hubGrid.appendChild(btn);
          });
        }

        document.getElementById("cat-tabs").addEventListener("click", function (e) {
          var btn = e.target.closest("[data-cat]");
          if (!btn) return;
          activeCat = btn.getAttribute("data-cat");
          this.querySelectorAll(".seg-btn").forEach(function (el) {
            el.setAttribute("aria-selected", el === btn ? "true" : "false");
          });
          renderHub();
        });

        searchInput.addEventListener("input", renderHub);

        function openCalc() {
          viewHub.hidden = true;
          viewCalc.hidden = false;
          btnBack.hidden = false;
          updateCalc();
        }

        btnBack.addEventListener("click", function () {
          viewCalc.hidden = true;
          viewHub.hidden = false;
          btnBack.hidden = true;
        });

        // 3. Interaktiver NTC-10k-Rechner (B = 3950 K)
        var dir = "ohmToTemp";
        var calcInput = document.getElementById("calc-input");
        var inputLabel = document.getElementById("input-label");
        var inputUnit = document.getElementById("input-unit");
        var resCaption = document.getElementById("res-caption");
        var resValue = document.getElementById("res-value");
        var resMeta = document.getElementById("res-meta");
        var presetRow = document.getElementById("preset-row");

        var R0 = 10000;
        var T0 = 298.15;
        var B = 3950;

        function renderPresets() {
          presetRow.replaceChildren();
          var items = dir === "ohmToTemp"
            ? [{ label: "27 kΩ", val: 27000 }, { label: "10 kΩ", val: 10000 }, { label: "5 kΩ", val: 5000 }, { label: "2,5 kΩ", val: 2500 }]
            : [{ label: "-10 °C", val: -10 }, { label: "0 °C", val: 0 }, { label: "25 °C", val: 25 }, { label: "60 °C", val: 60 }];

          items.forEach(function (item) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "chip-btn press-btn";
            b.textContent = item.label;
            b.addEventListener("click", function () {
              calcInput.value = String(item.val);
              updateCalc();
            });
            presetRow.appendChild(b);
          });
        }

        function updateCalc() {
          var v = parseFloat(calcInput.value);
          if (dir === "ohmToTemp") {
            inputLabel.textContent = "Gemessener Widerstand (Ω)";
            inputUnit.textContent = "Ω";
            resCaption.textContent = "Berechnete Temperatur";
            if (!Number.isFinite(v) || v <= 0) {
              resValue.textContent = "–";
              resMeta.textContent = "Bitte positiven Widerstandswert eingeben";
              return;
            }
            var invT = (1 / T0) + (1 / B) * Math.log(v / R0);
            var tempC = (1 / invT) - 273.15;
            resValue.textContent = tempC.toFixed(1).replace(".", ",") + " °C";
            resMeta.textContent = "NTC 10 kΩ · B = 3950 K · " + v.toLocaleString("de-DE") + " Ω";
          } else {
            inputLabel.textContent = "Zieltemperatur (°C)";
            inputUnit.textContent = "°C";
            resCaption.textContent = "Erwarteter Widerstand";
            if (!Number.isFinite(v) || v < -60 || v > 150) {
              resValue.textContent = "–";
              resMeta.textContent = "Gültiger Bereich: -60 °C bis +150 °C";
              return;
            }
            var tK = v + 273.15;
            var ohm = R0 * Math.exp(B * ((1 / tK) - (1 / T0)));
            resValue.textContent = Math.round(ohm).toLocaleString("de-DE") + " Ω";
            resMeta.textContent = "NTC 10 kΩ · B = 3950 K · " + v.toFixed(1).replace(".", ",") + " °C";
          }
        }

        document.getElementById("dir-tabs").addEventListener("click", function (e) {
          var btn = e.target.closest("[data-dir]");
          if (!btn) return;
          dir = btn.getAttribute("data-dir");
          this.querySelectorAll(".seg-btn").forEach(function (el) {
            el.setAttribute("aria-selected", el === btn ? "true" : "false");
          });
          calcInput.value = dir === "ohmToTemp" ? "10000" : "25";
          renderPresets();
          updateCalc();
        });

        calcInput.addEventListener("input", updateCalc);

        renderHub();
        renderPresets();
        updateCalc();
      })();
    </script>
  </body>
</html>
