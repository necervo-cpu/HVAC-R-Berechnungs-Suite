<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="Rohrnetz" />
    <title>Rohrnetz · HVAC·R Rechner</title>
    <link rel="icon" type="image/svg+xml" href="../../icon.svg" />
    <link rel="apple-touch-icon" href="../../icon.svg" />
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var mode = window.localStorage.getItem("hvacr-theme-mode");
          if (mode === "light" || mode === "dark") {
            root.setAttribute("data-theme", mode);
          }
        } catch (e) {}
        root.style.transform = "translateZ(0)";
        void root.offsetHeight;
        root.style.transform = "";
        window.scrollTo(0, 0);
      })();
    </script>
    <script type="module" src="../../assets/js/shared.js" blocking="render"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../../assets/css/global.css" />
  </head>
  <body>
    <header class="hero hero--app">
      <div class="hero-in">
        <div class="hero-nav-row">
          <div class="hero-nav-left">
            <a
              href="../../index.html"
              id="nav-home-link"
              class="back-btn press-btn"
              aria-label="Zurück zum Dashboard"
            >
              <span class="ag-icon ag-icon--xs" aria-hidden="true">arrow_back_ios_new</span>
              <span>Übersicht</span>
            </a>
            <button
              type="button"
              id="nav-back-btn"
              class="back-btn press-btn"
              aria-label="Zurück zum Rechner"
              hidden
            >
              <span class="ag-icon ag-icon--xs" aria-hidden="true">arrow_back_ios_new</span>
              <span>Zurück</span>
            </button>
          </div>
          <button
            type="button"
            id="settings-toggle-btn"
            class="settings-btn press-icon"
            aria-label="Einstellungen öffnen"
          >
            <span class="ag-icon ag-icon--sm" aria-hidden="true">settings</span>
          </button>
        </div>
        <div class="hero-tt">
          <h1 id="brand-title">Rohrnetz</h1>
        </div>
      </div>
    </header>

    <main class="app-shell">

      <div id="view-calc" class="view-stack calc-panel">
        <!-- Eingabemodus -->
        <div class="segmented" id="mode-tabs" role="tablist" aria-label="Eingabemodus">
          <span class="t-tabs-pill" aria-hidden="true"></span>
          <button
            type="button"
            class="tab-btn press-btn"
            role="tab"
            aria-selected="true"
            data-mode="flow"
          >
            Volumenstrom
          </button>
          <button
            type="button"
            class="tab-btn press-btn"
            role="tab"
            aria-selected="false"
            data-mode="power"
          >
            Leistung &amp; ΔT
          </button>
        </div>

        <!-- Hauptkarte -->
        <section class="liquid-glass-card" aria-label="Rohrnetz-Berechnung">
          <!-- Live-Ergebnis -->
          <div class="result-hero" aria-live="polite">
            <div class="result-top">
              <span id="result-label" class="result-label">Fließgeschwindigkeit v</span>
              <span id="result-badge" class="status-badge" data-state="ok">Optimal</span>
            </div>
            <div class="result-value-row">
              <div class="result-main" id="result-main">
                <span id="result-number">0,63</span><span id="result-unit" class="result-unit">m/s</span>
              </div>
            </div>
            <div id="result-sub" class="result-sub">R = 1,92 mbar/m (192 Pa/m) · 1.500 l/h · dᵢ 26,0 mm</div>
            <div class="result-meter" aria-hidden="true">
              <div id="result-meter-fill" class="result-meter-fill" data-state="ok"></div>
            </div>
          </div>

          <!-- Rohrmaterial -->
          <div class="well">
            <div class="well-header">
              <span class="well-label">Rohrmaterial</span>
              <span id="pipe-roughness-hint" class="well-hint">k = 0,0015 mm</span>
            </div>
            <div class="chip-group" id="material-group" role="group" aria-label="Rohrmaterial">
              <button type="button" class="chip-btn press-btn" data-material="copper" aria-pressed="true">Kupfer</button>
              <button type="button" class="chip-btn press-btn" data-material="pex" aria-pressed="false">Verbund</button>
              <button type="button" class="chip-btn press-btn" data-material="steel_press" aria-pressed="false">C-Stahl</button>
              <button type="button" class="chip-btn press-btn" data-material="steel_thread" aria-pressed="false">Gewinde</button>
            </div>
          </div>

          <!-- Nennweite / Dimension -->
          <div class="well">
            <div class="well-header">
              <span class="well-label">Dimension</span>
              <span id="pipe-di-hint" class="well-hint">dᵢ = 25,0 mm</span>
            </div>
            <div class="chip-group" id="size-group" role="group" aria-label="Rohrdimension"></div>
          </div>

          <!-- PANEL 1: Direkter Volumenstrom -->
          <div id="panel-flow" class="calc-panel view-stack">
            <div class="well">
              <div class="well-header">
                <label class="well-label" for="flow-input">Volumenstrom V̇</label>
              </div>
              <div class="segmented segmented--compact" id="flow-unit-tabs" role="tablist" aria-label="Einheit Volumenstrom">
                <span class="t-tabs-pill" aria-hidden="true"></span>
                <button type="button" class="tab-btn press-btn" role="tab" aria-selected="true" data-flow-unit="m3h">m³/h</button>
                <button type="button" class="tab-btn press-btn" role="tab" aria-selected="false" data-flow-unit="lh">l/h</button>
                <button type="button" class="tab-btn press-btn" role="tab" aria-selected="false" data-flow-unit="lmin">l/min</button>
              </div>
              <div class="stepper-row">
                <button type="button" class="step-btn press-btn" id="flow-minus" aria-label="Volumenstrom verringern">−</button>
                <div class="num-value-wrap">
                  <input
                    id="flow-input"
                    class="num-input"
                    type="number"
                    inputmode="decimal"
                    step="any"
                    min="0"
                    value="1.5"
                    aria-label="Volumenstrom"
                  />
                  <span id="flow-unit-label" class="num-unit">m³/h</span>
                </div>
                <button type="button" class="step-btn press-btn" id="flow-plus" aria-label="Volumenstrom erhöhen">+</button>
              </div>
            </div>
          </div>

          <!-- PANEL 2: Leistung & Spreizung -->
          <div id="panel-power" class="calc-panel view-stack" hidden>
            <div class="field-grid field-grid--2">
              <div class="well">
                <div class="well-header">
                  <label class="well-label" for="power-input">Leistung Q̇</label>
                </div>
                <div class="stepper-row">
                  <button type="button" class="step-btn press-btn" id="power-minus" aria-label="Leistung verringern">−</button>
                  <div class="num-value-wrap">
                    <input
                      id="power-input"
                      class="num-input"
                      type="number"
                      inputmode="decimal"
                      step="0.5"
                      min="0"
                      value="15"
                      aria-label="Leistung in Kilowatt"
                    />
                    <span class="num-unit">kW</span>
                  </div>
                  <button type="button" class="step-btn press-btn" id="power-plus" aria-label="Leistung erhöhen">+</button>
                </div>
              </div>

              <div class="well">
                <div class="well-header">
                  <label class="well-label" for="dt-input">Spreizung ΔT</label>
                </div>
                <div class="stepper-row">
                  <button type="button" class="step-btn press-btn" id="dt-minus" aria-label="Spreizung verringern">−</button>
                  <div class="num-value-wrap">
                    <input
                      id="dt-input"
                      class="num-input"
                      type="number"
                      inputmode="decimal"
                      step="0.5"
                      min="0.1"
                      value="10"
                      aria-label="Temperaturspreizung in Kelvin"
                    />
                    <span class="num-unit">K</span>
                  </div>
                  <button type="button" class="step-btn press-btn" id="dt-plus" aria-label="Spreizung erhöhen">+</button>
                </div>
              </div>
            </div>

            <div class="well">
              <div class="well-header">
                <span class="well-label">Typische Spreizung ΔT</span>
              </div>
              <div class="chip-group" id="dt-preset-group" role="group" aria-label="Typische Spreizungswerte">
                <button type="button" class="chip-btn press-btn" data-dt="5" aria-pressed="false">5 K</button>
                <button type="button" class="chip-btn press-btn" data-dt="7" aria-pressed="false">7 K</button>
                <button type="button" class="chip-btn press-btn" data-dt="10" aria-pressed="true">10 K</button>
                <button type="button" class="chip-btn press-btn" data-dt="15" aria-pressed="false">15 K</button>
                <button type="button" class="chip-btn press-btn" data-dt="20" aria-pressed="false">20 K</button>
              </div>
            </div>
          </div>

          <!-- Medium & Temperatur -->
          <div class="well">
            <div class="well-header">
              <span class="well-label">Medium &amp; Temperatur</span>
            </div>
            <div class="chip-group" id="medium-group" role="group" aria-label="Medium und Temperatur">
              <button type="button" class="chip-btn press-btn" data-fluid="water_50" aria-pressed="true">Heizung 50 °C</button>
              <button type="button" class="chip-btn press-btn" data-fluid="water_35" aria-pressed="false">WP 35 °C</button>
              <button type="button" class="chip-btn press-btn" data-fluid="water_10" aria-pressed="false">Kalt 10 °C</button>
              <button type="button" class="chip-btn press-btn" data-fluid="glycol_30" aria-pressed="false">Glykol 30 %</button>
            </div>
          </div>
        </section>
      </div>

      <!-- EINSTELLUNGEN-ANSICHT -->
      <section id="view-settings" class="liquid-glass-card calc-panel" aria-label="Einstellungen" hidden>
        <div class="well">
          <div class="well-header">
            <span class="well-label">Darstellung</span>
          </div>
          <div id="theme-mode-group" class="settings-segmented" role="radiogroup" aria-label="Darstellungsmodus">
            <button type="button" class="settings-seg-btn press-btn" role="radio" data-theme-mode="auto" aria-checked="true">Auto</button>
            <button type="button" class="settings-seg-btn press-btn" role="radio" data-theme-mode="light" aria-checked="false">Hell</button>
            <button type="button" class="settings-seg-btn press-btn" role="radio" data-theme-mode="dark" aria-checked="false">Dunkel</button>
          </div>
        </div>

        <div class="field-grid field-grid--2">
          <div class="well">
            <div class="well-header">
              <label class="well-label" for="param-vopt-input">Max. v „Optimal“</label>
            </div>
            <div class="stepper-row">
              <button type="button" class="step-btn press-btn" id="param-vopt-minus" aria-label="Geschwindigkeitsgrenze verringern">−</button>
              <div class="num-value-wrap">
                <input id="param-vopt-input" class="num-input" type="number" inputmode="decimal" step="0.1" min="0.3" max="1.5" value="0.8" aria-label="Maximale optimale Fließgeschwindigkeit in Metern pro Sekunde" />
                <span class="num-unit">m/s</span>
              </div>
              <button type="button" class="step-btn press-btn" id="param-vopt-plus" aria-label="Geschwindigkeitsgrenze erhöhen">+</button>
            </div>
          </div>

          <div class="well">
            <div class="well-header">
              <label class="well-label" for="param-fitting-input">Formteil-Zuschlag</label>
            </div>
            <div class="stepper-row">
              <button type="button" class="step-btn press-btn" id="param-fitting-minus" aria-label="Formteilzuschlag verringern">−</button>
              <div class="num-value-wrap">
                <input id="param-fitting-input" class="num-input" type="number" inputmode="decimal" step="5" min="0" max="100" value="0" aria-label="Zuschlag für Einzelwiderstände in Prozent" />
                <span class="num-unit">%</span>
              </div>
              <button type="button" class="step-btn press-btn" id="param-fitting-plus" aria-label="Formteilzuschlag erhöhen">+</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="toast-pill" class="toast-pill" role="status" aria-live="polite" data-visible="false"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
