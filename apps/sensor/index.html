<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#18181b" />
    <meta name="apple-mobile-web-app-title" content="PTC / NTC Sensoren" />
    <title>PTC / NTC Sensoren · HVAC·R</title>
    <link rel="icon" type="image/svg+xml" href="../../icon.svg" />
    <link rel="apple-touch-icon" href="../../icon.svg" />
    <script>
      (function () {
        var root = document.documentElement;
        root.style.transform = "translateZ(0)";
        void root.offsetHeight;
        root.style.transform = "";
        window.scrollTo(0, 0);
      })();
    </script>
    <script type="module" src="../../assets/js/shared.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <div class="brand-mark">
          <a href="../../index.html" id="nav-home-link" class="back-btn press-btn" aria-label="Zurück zum Dashboard">
            <span class="ag-icon ag-icon--xs" aria-hidden="true">arrow_back_ios_new</span>
            <span>Übersicht</span>
          </a>
          <button type="button" id="nav-back-btn" class="back-btn press-btn" aria-label="Zurück zum Rechner" hidden>
            <span class="ag-icon ag-icon--xs" aria-hidden="true">arrow_back_ios_new</span>
            <span>Zurück</span>
          </button>
          <span id="brand-title" class="brand-title">PTC / NTC</span>
        </div>
        <div class="top-actions">
          <button type="button" id="settings-toggle-btn" class="settings-btn press-icon" aria-label="Einstellungen öffnen">
            <span class="ag-icon" aria-hidden="true">settings</span>
          </button>
        </div>
      </header>

      <section id="panel-sensor" class="liquid-glass-card calc-panel is-entering" aria-label="PTC und NTC Sensor-Rechner">
        <!-- Richtung: Ohm -> °C vs. °C -> Ohm -->
        <div id="sensor-dir-switcher" class="segmented segmented--compact" role="tablist" aria-label="Umrechnungsrichtung">
          <span class="t-tabs-pill" aria-hidden="true"></span>
          <button type="button" class="tab-btn press-btn" role="tab" data-dir="ohmToTemp" aria-selected="true">
            Ohm → °C
          </button>
          <button type="button" class="tab-btn press-btn" role="tab" data-dir="tempToOhm" aria-selected="false">
            °C → Ohm
          </button>
        </div>

        <!-- Typ: NTC vs. PTC -->
        <div id="sensor-family-switcher" class="segmented segmented--compact" role="tablist" aria-label="Sensortyp">
          <span class="t-tabs-pill" aria-hidden="true"></span>
          <button type="button" class="tab-btn press-btn" role="tab" data-family="ntc" aria-selected="true">
            NTC-Fühler
          </button>
          <button type="button" class="tab-btn press-btn" role="tab" data-family="ptc" aria-selected="false">
            PTC-Fühler
          </button>
        </div>

        <!-- Live Ergebnis Hero -->
        <div class="result-hero" aria-live="polite">
          <div class="result-top">
            <span id="sensor-result-title" class="result-label">NTC 10 kΩ (B=3435)</span>
            <span id="sensor-status-badge" class="status-badge" data-state="ok">Plausibel · Arbeitsbereich</span>
          </div>
          <div class="result-value-row">
            <div id="sensor-result-val" class="result-main">25,0<span class="result-unit">°C</span></div>
            <div id="sensor-result-sub" class="result-sub">R₂₅ = 10.000 Ω · B = 3435 K</div>
          </div>
        </div>

        <!-- Kennlinien-Auswahl als Dropdown -->
        <div class="well">
          <div class="well-header">
            <label class="well-label" for="sensor-select">Sensorkennlinie</label>
          </div>
          <div class="select-wrap">
            <div class="glass-select-face" aria-hidden="true">
              <span id="sensor-select-label" class="glass-select-label">NTC 10 kΩ (B=3435)</span>
              <svg class="select-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
            <select id="sensor-select" class="glass-select-native" aria-label="Sensorkennlinie wählen"></select>
          </div>
        </div>

        <!-- Optionales Panel für eigenen NTC (R25 & B-Wert) -->
        <div id="custom-ntc-panel" class="t-acc-panel" data-open="false">
          <div class="t-acc-panel-inner">
            <div class="custom-ntc-grid">
              <div class="well">
                <div class="well-header">
                  <label class="well-label" for="input-custom-r25">R₂₅ (Ω)</label>
                </div>
                <input id="input-custom-r25" class="num-input" type="text" inputmode="numeric" value="10000" aria-label="Nennwiderstand R25 in Ohm" />
              </div>
              <div class="well">
                <div class="well-header">
                  <label class="well-label" for="input-custom-b">B-Wert (K)</label>
                </div>
                <input id="input-custom-b" class="num-input" type="text" inputmode="numeric" value="3950" aria-label="B-Wert in Kelvin" />
              </div>
            </div>
          </div>
        </div>

        <!-- Haupt-Eingabe mit Steppern -->
        <div class="well">
          <div class="well-header">
            <label id="sensor-input-label" class="well-label" for="input-sensor-val">Gemessener Widerstand</label>
            <span id="sensor-step-hint" class="well-hint">Schritt ±100 Ω</span>
          </div>
          <div class="stepper-row">
            <button type="button" id="sensor-step-minus" class="step-btn press-icon" aria-label="Wert verringern">−</button>
            <label class="num-value-wrap" for="input-sensor-val">
              <input id="input-sensor-val" class="num-input" type="text" inputmode="decimal" value="10000" aria-label="Messwert eingeben" />
              <span id="sensor-input-unit" class="num-unit">Ω</span>
            </label>
            <button type="button" id="sensor-step-plus" class="step-btn press-icon" aria-label="Wert erhöhen">+</button>
          </div>
        </div>

        <!-- Aufklappbare Prüfpunkte (0 / 20 / 25 / 50 °C) -->
        <button
          type="button"
          id="ref-acc-trigger"
          class="acc-trigger press-card"
          aria-expanded="false"
          aria-controls="ref-acc-panel"
        >
          <span>Prüfpunkte dieser Kennlinie (0–50 °C)</span>
          <svg class="acc-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div id="ref-acc-panel" class="t-acc-panel" data-open="false">
          <div class="t-acc-panel-inner">
            <div id="sensor-ref-grid" class="ref-grid"></div>
          </div>
        </div>
      </section>

      <section id="view-settings" class="liquid-glass-card calc-panel" aria-label="Einstellungen" hidden>
        <div class="well">
          <div class="well-header">
            <span class="well-label">Darstellung</span>
          </div>
          <div id="theme-mode-group" class="settings-segmented" role="radiogroup" aria-label="Darstellungsmodus">
            <button type="button" class="settings-seg-btn press-btn" role="radio" data-theme-mode="auto" aria-checked="true">Auto</button>
            <button type="button" class="settings-seg-btn press-btn" role="radio" data-theme-mode="light" aria-checked="false">Hell</button>
            <button type="button" class="settings-seg-btn press-btn" role="radio" data-theme-mode="dark" aria-checked="false">Dunkel</button>
          </div>
        </div>

        <div class="well">
          <div class="well-header">
            <label class="well-label" for="param-lead-ohm">Leitungswiderstand (2-Leiter)</label>
            <span class="well-hint">Standard 0,0 Ω</span>
          </div>
          <div class="stepper-row">
            <button type="button" class="step-btn press-btn" id="param-lead-minus" aria-label="Leitungswiderstand verringern">−</button>
            <div class="num-value-wrap">
              <input id="param-lead-ohm" class="num-input" type="number" inputmode="decimal" step="0.2" min="0" max="20" value="0" aria-label="Leitungswiderstand in Ohm" />
              <span class="num-unit">Ω</span>
            </div>
            <button type="button" class="step-btn press-btn" id="param-lead-plus" aria-label="Leitungswiderstand erhöhen">+</button>
          </div>
        </div>

        <div class="well">
          <div class="well-header">
            <span class="well-label">Nachkommastellen (°C)</span>
          </div>
          <div class="chip-group" id="param-decimals-group" role="group" aria-label="Nachkommastellen für Temperatur">
            <button type="button" class="chip-btn press-btn" data-dec="1" aria-pressed="true">1 Stelle (0,1 °C)</button>
            <button type="button" class="chip-btn press-btn" data-dec="2" aria-pressed="false">2 Stellen (0,01 °C)</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
