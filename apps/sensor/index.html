<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="PTC / NTC Sensoren" />
    <title>PTC / NTC Sensoren | HVAC·R</title>
    <link rel="icon" type="image/svg+xml" href="../../icon.svg" />
    <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="agFonts"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0..200&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0..200&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      (function () {
        var root = document.documentElement, link = document.getElementById('agFonts');
        if (!link || !document.fonts || !document.fonts.load) return;
        var done = function () { root.classList.remove('icons-pending'); };
        root.classList.add('icons-pending');
        setTimeout(done, 4000);
        link.addEventListener('load', function () {
          setTimeout(function () { document.fonts.load('24px "Material Symbols Rounded"').then(done, done); }, 0);
        });
        link.addEventListener('error', done);
      })();
    </script>
    <script>
      (function () {
        var root = document.documentElement;
        var savedTheme = null;
        try {
          savedTheme = localStorage.getItem("ag-theme");
        } catch (e) {}
        var systemPrefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
        var activeTheme =
          savedTheme === "light" || savedTheme === "dark" ? savedTheme : systemPrefersLight ? "light" : "dark";
        root.setAttribute("data-theme", activeTheme);
      })();
    </script>
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="../../assets/js/shared.js"></script>
  </head>
  <body>
    <div class="ambient-canvas" aria-hidden="true"></div>

    <main class="app-shell app-shell--narrow app-shell--split">
      <div class="app-topbar">
        <a href="../../index.html" class="back-btn">
          <span class="material-symbols-rounded" aria-hidden="true">chevron_left</span>Übersicht
        </a>
        <div class="top-actions">
          <button type="button" id="reset-calc-btn" class="icon-btn" aria-label="Eingaben zurücksetzen" title="Zurücksetzen">
            <span class="material-symbols-rounded" aria-hidden="true">restart_alt</span>
          </button>
          <button type="button" id="themeToggleBtn" class="icon-btn" aria-label="Erscheinungsbild wechseln" title="Erscheinungsbild wechseln">
            <span class="material-symbols-rounded" id="themeToggleIcon" aria-hidden="true">light_mode</span>
          </button>
          <button type="button" id="settings-toggle-btn" class="icon-btn" aria-label="Einstellungen öffnen" title="Einstellungen">
            <span class="material-symbols-rounded" aria-hidden="true">settings</span>
          </button>
        </div>
      </div>

      <header class="app-header">
        <div class="app-header-text">
          <h1 class="brand-title">PTC / NTC Sensoren</h1>
        </div>
      </header>

      <div class="split">
      <section class="glass-card" aria-label="Umrechnung">
        <div id="sensor-dir-switcher" class="segmented-control" role="group" aria-label="Umrechnungsrichtung">
          <button type="button" class="segmented-option" data-dir="ohmToTemp" aria-pressed="true">Ohm in °C</button>
          <button type="button" class="segmented-option" data-dir="tempToOhm" aria-pressed="false">°C in Ohm</button>
        </div>
        <div id="sensor-family-switcher" class="segmented-control" role="group" aria-label="Sensortyp">
          <button type="button" class="segmented-option" data-family="ntc" aria-pressed="true">NTC-Fühler</button>
          <button type="button" class="segmented-option" data-family="ptc" aria-pressed="false">PTC-Fühler</button>
        </div>
      </section>

      <div class="split-aside">
      <section class="hero" aria-live="polite" aria-label="Ergebnis">
        <div id="sensor-result-title" class="hero-caption">NTC 10 kΩ (B=3435)</div>
        <div id="sensor-result-val" class="hero-value numeric">25,0<span class="metric-unit">°C</span></div>
        <span id="sensor-status-badge" class="status-pill status-pill--green" data-state="ok"><span class="status-dot"></span><span id="sensor-status-text">Plausibel</span></span>
        <p id="sensor-result-sub" class="hero-note hint numeric"></p>
      </section>
      </div>

      <section class="glass-card" aria-label="Eingabe">
        <div class="form-group">
          <span id="sensor-select-label" class="form-label">Sensorkennlinie</span>
          <div id="sensor-select-host" aria-labelledby="sensor-select-label"></div>
        </div>

        <div id="custom-ntc-panel" class="custom-ntc-grid" hidden>
          <div class="form-group">
            <label class="form-label" for="input-custom-r25"><span>R₂₅</span></label>
            <div class="liquid-surface-inner input-wrapper">
              <input id="input-custom-r25" class="glass-input numeric" type="text" inputmode="decimal" value="10000" autocomplete="off" aria-label="Nennwiderstand R25 in Ohm" />
              <span class="input-unit-addon">Ω</span>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="input-custom-b"><span>B-Wert</span></label>
            <div class="liquid-surface-inner input-wrapper">
              <input id="input-custom-b" class="glass-input numeric" type="text" inputmode="decimal" value="3950" autocomplete="off" aria-label="B-Wert in Kelvin" />
              <span class="input-unit-addon">K</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="input-sensor-val">
            <span id="sensor-input-label">Gemessener Widerstand</span>
            <span id="sensor-step-hint">Schritt ±100 Ω</span>
          </label>
          <div class="control-slide">
            <button type="button" id="sensor-step-minus" class="stepper" aria-label="Wert verringern">
              <span class="material-symbols-rounded" aria-hidden="true">remove</span>
            </button>
            <div class="liquid-surface-inner input-wrapper" style="flex: 1; min-width: 0;">
              <input id="input-sensor-val" class="glass-input numeric" type="text" inputmode="decimal" value="10000" autocomplete="off" aria-label="Messwert eingeben" />
              <span id="sensor-input-unit" class="input-unit-addon">Ω</span>
            </div>
            <button type="button" id="sensor-step-plus" class="stepper" aria-label="Wert erhöhen">
              <span class="material-symbols-rounded" aria-hidden="true">add</span>
            </button>
          </div>
        </div>

      </section>

      <section class="group" aria-label="Prüfpunkte">
        <div id="ref-acc" class="acc">
          <button type="button" id="ref-acc-trigger" class="acc-head" aria-expanded="false" aria-controls="ref-acc-panel">
            <span class="acc-name">Prüfpunkte dieser Kennlinie, 0 bis 50 °C</span>
            <span class="material-symbols-rounded acc-chevron" aria-hidden="true">expand_more</span>
          </button>
          <div id="ref-acc-panel" class="acc-body">
            <div>
              <div id="sensor-ref-grid" class="ref-grid"></div>
            </div>
          </div>
        </div>
      </section>
      </div>
    </main>

    <div id="settings-overlay" class="modal-overlay" aria-hidden="true">
      <div class="liquid-glass modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="modal-head">
          <h2 id="settings-title" class="modal-title">Einstellungen</h2>
          <button type="button" id="settings-close-btn" class="icon-btn" aria-label="Einstellungen schließen">
            <span class="material-symbols-rounded" aria-hidden="true">close</span>
          </button>
        </div>

        <div class="form-group">
          <span class="form-label">Darstellung</span>
          <div id="theme-mode-group" class="segmented-control" role="group" aria-label="Darstellungsmodus">
            <button type="button" class="segmented-option" data-theme-mode="light" aria-pressed="false">Hell</button>
            <button type="button" class="segmented-option" data-theme-mode="dark" aria-pressed="false">Dunkel</button>
            <button type="button" class="segmented-option" data-theme-mode="auto" aria-pressed="true">System</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="param-lead-ohm"><span>Leitungswiderstand (2-Leiter)</span></label>
          <div class="control-slide">
            <button type="button" class="stepper" id="param-lead-minus" aria-label="Leitungswiderstand verringern">
              <span class="material-symbols-rounded" aria-hidden="true">remove</span>
            </button>
            <div class="liquid-surface-inner input-wrapper" style="flex: 1; min-width: 0;">
              <input id="param-lead-ohm" class="glass-input numeric" type="text" inputmode="decimal" value="0" autocomplete="off" aria-label="Leitungswiderstand in Ohm" />
              <span class="input-unit-addon">Ω</span>
            </div>
            <button type="button" class="stepper" id="param-lead-plus" aria-label="Leitungswiderstand erhöhen">
              <span class="material-symbols-rounded" aria-hidden="true">add</span>
            </button>
          </div>
        </div>

        <div class="form-group">
          <span class="form-label">Nachkommastellen der Temperatur</span>
          <div class="segmented-control" id="param-decimals-group" role="group" aria-label="Nachkommastellen für Temperatur">
            <button type="button" class="segmented-option" data-dec="1" aria-pressed="true">0,1 °C</button>
            <button type="button" class="segmented-option" data-dec="2" aria-pressed="false">0,01 °C</button>
          </div>
        </div>
      </div>
    </div>

    <div id="toast-pill" class="toast-pill" role="status" aria-live="polite"><span class="material-symbols-rounded" aria-hidden="true">check_circle</span><span id="toast-text"></span></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
