<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="Taupunkt" />
    <title>Taupunkt &amp; Feuchte · HVAC·R Rechner</title>
    <link rel="icon" type="image/svg+xml" href="../../icon.svg" />
    <link rel="apple-touch-icon" href="../../icon.svg" />
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var mode = window.localStorage.getItem("hvacr-theme-mode");
          if (mode === "light" || mode === "dark") {
            root.setAttribute("data-theme", mode);
          }
        } catch (e) {}
        root.style.transform = "translateZ(0)";
        void root.offsetHeight;
        root.style.transform = "";
        window.scrollTo(0, 0);
      })();
    </script>
    <script type="module" src="../../assets/js/shared.js" blocking="render"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../../assets/css/global.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <div class="brand-mark">
          <a href="../../index.html" id="nav-home-link" class="back-btn press-btn" aria-label="Zurück zum Dashboard">
            <span class="ag-icon ag-icon--xs" aria-hidden="true">arrow_back_ios_new</span>
            <span>Übersicht</span>
          </a>
          <button type="button" id="nav-back-btn" class="back-btn press-btn" aria-label="Zurück zum Rechner" hidden>
            <span class="ag-icon ag-icon--xs" aria-hidden="true">arrow_back_ios_new</span>
            <span>Zurück</span>
          </button>
          <span id="brand-title" class="brand-title">Taupunkt</span>
        </div>
        <div class="top-actions">
          <button type="button" id="settings-toggle-btn" class="settings-btn press-icon" aria-label="Einstellungen öffnen">
            <span class="ag-icon" aria-hidden="true">settings</span>
          </button>
        </div>
      </header>

      <div id="view-calc" class="view-stack calc-panel">
        <div class="segmented" id="mode-tabs" role="tablist" aria-label="Berechnungsmodus">
          <span class="t-tabs-pill" aria-hidden="true"></span>
          <button type="button" class="tab-btn press-btn" role="tab" aria-selected="true" data-mode="dewpoint">Taupunkt</button>
          <button type="button" class="tab-btn press-btn" role="tab" aria-selected="false" data-mode="condensation">Tauwasser-Check</button>
        </div>

        <section class="liquid-glass-card" aria-label="Taupunkt- und Feuchteberechnung">
          <div class="result-hero" aria-live="polite">
            <div class="result-top">
              <span id="result-label" class="result-label">Taupunkttemperatur</span>
              <span id="result-badge" class="status-badge" data-state="ok">Behaglich</span>
            </div>
            <div class="result-value-row">
              <div class="result-main" id="result-main">
                <span id="result-number">10,5</span><span id="result-unit" class="result-unit">°C</span>
              </div>
            </div>
            <div id="result-sub" class="result-sub">9,7 g/m³ · 8,0 g/kg · Enthalpie 42,5 kJ/kg</div>
            <div class="result-meter" aria-hidden="true">
              <div id="result-meter-fill" class="result-meter-fill" data-state="ok"></div>
            </div>
          </div>

          <div class="field-grid field-grid--2">
            <div class="well">
              <div class="well-header">
                <label class="well-label" for="tp-temp-input">Lufttemperatur</label>
              </div>
              <div class="stepper-row">
                <button type="button" class="step-btn press-btn" id="tp-temp-minus" aria-label="Temperatur verringern">−</button>
                <div class="num-value-wrap">
                  <input id="tp-temp-input" class="num-input" type="number" inputmode="decimal" step="0.5" min="-30" max="60" value="22" aria-label="Lufttemperatur in Grad Celsius" />
                  <span class="num-unit">°C</span>
                </div>
                <button type="button" class="step-btn press-btn" id="tp-temp-plus" aria-label="Temperatur erhöhen">+</button>
              </div>
            </div>

            <div class="well">
              <div class="well-header">
                <label class="well-label" for="tp-rh-input">Rel. Luftfeuchte</label>
              </div>
              <div class="stepper-row">
                <button type="button" class="step-btn press-btn" id="tp-rh-minus" aria-label="Luftfeuchte verringern">−</button>
                <div class="num-value-wrap">
                  <input id="tp-rh-input" class="num-input" type="number" inputmode="decimal" step="2" min="1" max="100" value="50" aria-label="Relative Luftfeuchte in Prozent" />
                  <span class="num-unit">%</span>
                </div>
                <button type="button" class="step-btn press-btn" id="tp-rh-plus" aria-label="Luftfeuchte erhöhen">+</button>
              </div>
            </div>
          </div>

          <div class="well" id="surface-temp-well" hidden>
            <div class="well-header">
              <label class="well-label" for="tp-surface-input">Oberflächen- / Vorlauftemperatur</label>
            </div>
            <div class="stepper-row">
              <button type="button" class="step-btn press-btn" id="tp-surface-minus" aria-label="Oberflächentemperatur verringern">−</button>
              <div class="num-value-wrap">
                <input id="tp-surface-input" class="num-input" type="number" inputmode="decimal" step="0.5" min="-30" max="60" value="16" aria-label="Oberflächentemperatur in Grad Celsius" />
                <span class="num-unit">°C</span>
              </div>
              <button type="button" class="step-btn press-btn" id="tp-surface-plus" aria-label="Oberflächentemperatur erhöhen">+</button>
            </div>
          </div>

          <div class="well">
            <div class="well-header">
              <span class="well-label">Typische Raumzustände</span>
            </div>
            <div class="chip-group" id="climate-preset-group" role="group" aria-label="Typische Raumzustände">
              <button type="button" class="chip-btn press-btn" data-t="22" data-rh="50" aria-pressed="true">Büro 22°/50%</button>
              <button type="button" class="chip-btn press-btn" data-t="26" data-rh="60" aria-pressed="false">Sommer 26°/60%</button>
              <button type="button" class="chip-btn press-btn" data-t="18" data-rh="70" aria-pressed="false">Keller 18°/70%</button>
            </div>
          </div>
        </section>
      </div>

      <section id="view-settings" class="liquid-glass-card calc-panel" aria-label="Einstellungen" hidden>
        <div class="well">
          <div class="well-header">
            <span class="well-label">Darstellung</span>
          </div>
          <div id="theme-mode-group" class="settings-segmented" role="radiogroup" aria-label="Darstellungsmodus">
            <button type="button" class="settings-seg-btn press-btn" role="radio" data-theme-mode="auto" aria-checked="true">Auto</button>
            <button type="button" class="settings-seg-btn press-btn" role="radio" data-theme-mode="light" aria-checked="false">Hell</button>
            <button type="button" class="settings-seg-btn press-btn" role="radio" data-theme-mode="dark" aria-checked="false">Dunkel</button>
          </div>
        </div>

        <div class="field-grid field-grid--2">
          <div class="well">
            <div class="well-header">
              <label class="well-label" for="param-patm-hpa-input">Luftdruck</label>
            </div>
            <div class="stepper-row">
              <button type="button" class="step-btn press-btn" id="param-patm-hpa-minus" aria-label="Luftdruck verringern">−</button>
              <div class="num-value-wrap">
                <input id="param-patm-hpa-input" class="num-input" type="number" inputmode="decimal" step="5" min="700" max="1100" value="1013" aria-label="Luftdruck in Hektopascal" />
                <span class="num-unit">hPa</span>
              </div>
              <button type="button" class="step-btn press-btn" id="param-patm-hpa-plus" aria-label="Luftdruck erhöhen">+</button>
            </div>
          </div>

          <div class="well">
            <div class="well-header">
              <label class="well-label" for="param-margin-input">Tauwasser-Reserve</label>
            </div>
            <div class="stepper-row">
              <button type="button" class="step-btn press-btn" id="param-margin-minus" aria-label="Sicherheitsabstand verringern">−</button>
              <div class="num-value-wrap">
                <input id="param-margin-input" class="num-input" type="number" inputmode="decimal" step="0.5" min="0.5" max="6" value="2" aria-label="Mindestabstand zum Taupunkt in Kelvin" />
                <span class="num-unit">K</span>
              </div>
              <button type="button" class="step-btn press-btn" id="param-margin-plus" aria-label="Sicherheitsabstand erhöhen">+</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="toast-pill" class="toast-pill" role="status" aria-live="polite" data-visible="false"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
