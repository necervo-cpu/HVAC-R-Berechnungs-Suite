<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="MAG & Vordruck" />
    <title>MAG &amp; Vordruck · HVAC·R Rechner</title>
    <link rel="icon" type="image/svg+xml" href="../../icon.svg" />
    <link rel="apple-touch-icon" href="../../icon.svg" />
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var mode = window.localStorage.getItem("hvacr-theme-mode");
          if (mode === "light" || mode === "dark") {
            root.setAttribute("data-theme", mode);
          }
        } catch (e) {}
        root.style.transform = "translateZ(0)";
        void root.offsetHeight;
        root.style.transform = "";
        window.scrollTo(0, 0);
      })();
    </script>
    <script type="module" src="../../assets/js/shared.js" blocking="render"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../../assets/css/global.css" />
  </head>
  <body>
    <header class="hero hero--app">
      <div class="hero-in">
        <div class="hero-nav-row">
          <div class="hero-nav-left">
            <a href="../../index.html" id="nav-home-link" class="back-btn press-btn" aria-label="Zurück zum Dashboard">
              <span class="ag-icon ag-icon--xs" aria-hidden="true">arrow_back_ios_new</span>
              <span>Übersicht</span>
            </a>
            <button type="button" id="nav-back-btn" class="back-btn press-btn" aria-label="Zurück zum Rechner" hidden>
              <span class="ag-icon ag-icon--xs" aria-hidden="true">arrow_back_ios_new</span>
              <span>Zurück</span>
            </button>
          </div>
          <button type="button" id="settings-toggle-btn" class="settings-btn press-icon" aria-label="Einstellungen öffnen">
            <span class="ag-icon ag-icon--sm" aria-hidden="true">settings</span>
          </button>
        </div>
        <div class="hero-tt">
          <h1 id="brand-title">MAG &amp; Vordruck</h1>
        </div>
      </div>
    </header>

    <main class="app-shell">

      <div id="view-calc" class="view-stack calc-panel">
        <div class="segmented" id="mode-tabs" role="tablist" aria-label="Berechnungsmodus">
          <span class="t-tabs-pill" aria-hidden="true"></span>
          <button type="button" class="tab-btn press-btn" role="tab" aria-selected="true" data-mode="pressure">Vordruck p₀</button>
          <button type="button" class="tab-btn press-btn" role="tab" aria-selected="false" data-mode="volume">MAG-Größe (l)</button>
        </div>

        <section class="liquid-glass-card" aria-label="MAG-Auslegung">
          <div class="result-hero" aria-live="polite">
            <div class="result-top">
              <span id="result-label" class="result-label">Stickstoff-Vordruck p₀</span>
              <span id="result-badge" class="status-badge" data-state="ok">EN 12828</span>
            </div>
            <div class="result-value-row">
              <div class="result-main" id="result-main">
                <span id="result-number">1,20</span><span id="result-unit" class="result-unit">bar</span>
              </div>
            </div>
            <div id="result-sub" class="result-sub">pₛₜ = 0,90 bar + 0,30 bar Zuschlag · Fülldruck pₐ = 1,50 bar · pₑ = 2,50 bar</div>
            <div class="result-meter" aria-hidden="true">
              <div id="result-meter-fill" class="result-meter-fill" data-state="ok"></div>
            </div>
          </div>

          <div class="field-grid field-grid--2">
            <div class="well">
              <div class="well-header">
                <label class="well-label" for="mag-height-input">Statische Höhe H</label>
              </div>
              <div class="stepper-row">
                <button type="button" class="step-btn press-btn" id="mag-height-minus" aria-label="Höhe verringern">−</button>
                <div class="num-value-wrap">
                  <input id="mag-height-input" class="num-input" type="number" inputmode="decimal" step="1" min="0" max="60" value="9" aria-label="Statische Höhe in Metern" />
                  <span class="num-unit">m</span>
                </div>
                <button type="button" class="step-btn press-btn" id="mag-height-plus" aria-label="Höhe erhöhen">+</button>
              </div>
            </div>

            <div class="well">
              <div class="well-header">
                <span class="well-label">Sicherheitsventil</span>
              </div>
              <div class="chip-group" id="sv-group" role="group" aria-label="Ansprechdruck Sicherheitsventil">
                <button type="button" class="chip-btn press-btn" data-sv="2.5" aria-pressed="false">2,5</button>
                <button type="button" class="chip-btn press-btn" data-sv="3.0" aria-pressed="true">3,0</button>
                <button type="button" class="chip-btn press-btn" data-sv="4.0" aria-pressed="false">4,0</button>
                <button type="button" class="chip-btn press-btn" data-sv="6.0" aria-pressed="false">6,0</button>
              </div>
            </div>
          </div>

          <div id="panel-volume" class="calc-panel view-stack" hidden>
            <div class="well">
              <div class="well-header">
                <label class="well-label" for="mag-vol-input">Anlagenvolumen Vₐ</label>
              </div>
              <div class="stepper-row">
                <button type="button" class="step-btn press-btn" id="mag-vol-minus" aria-label="Volumen verringern">−</button>
                <div class="num-value-wrap">
                  <input id="mag-vol-input" class="num-input" type="number" inputmode="decimal" step="20" min="10" max="10000" value="250" aria-label="Anlagenvolumen in Litern" />
                  <span class="num-unit">l</span>
                </div>
                <button type="button" class="step-btn press-btn" id="mag-vol-plus" aria-label="Volumen erhöhen">+</button>
              </div>
            </div>

            <div class="well">
              <div class="well-header">
                <span class="well-label">Max. Vorlauftemperatur</span>
              </div>
              <div class="chip-group" id="tmax-group" role="group" aria-label="Maximale Vorlauftemperatur">
                <button type="button" class="chip-btn press-btn" data-tmax="40" aria-pressed="false">40 °C (WP)</button>
                <button type="button" class="chip-btn press-btn" data-tmax="55" aria-pressed="false">55 °C</button>
                <button type="button" class="chip-btn press-btn" data-tmax="70" aria-pressed="true">70 °C</button>
                <button type="button" class="chip-btn press-btn" data-tmax="85" aria-pressed="false">85 °C</button>
              </div>
            </div>

            <div class="well">
              <div class="well-header">
                <span class="well-label">Medium</span>
              </div>
              <div class="chip-group" id="mag-medium-group" role="group" aria-label="Anlagenmedium">
                <button type="button" class="chip-btn press-btn" data-med="water" aria-pressed="true">Wasser</button>
                <button type="button" class="chip-btn press-btn" data-med="glycol" aria-pressed="false">Glykol 30 %</button>
              </div>
            </div>
          </div>
        </section>
      </div>

      <section id="view-settings" class="liquid-glass-card calc-panel" aria-label="Einstellungen" hidden>
        <div class="well">
          <div class="well-header">
            <span class="well-label">Darstellung</span>
          </div>
          <div id="theme-mode-group" class="settings-segmented" role="radiogroup" aria-label="Darstellungsmodus">
            <button type="button" class="settings-seg-btn press-btn" role="radio" data-theme-mode="auto" aria-checked="true">Auto</button>
            <button type="button" class="settings-seg-btn press-btn" role="radio" data-theme-mode="light" aria-checked="false">Hell</button>
            <button type="button" class="settings-seg-btn press-btn" role="radio" data-theme-mode="dark" aria-checked="false">Dunkel</button>
          </div>
        </div>

        <div class="field-grid field-grid--2">
          <div class="well">
            <div class="well-header">
              <label class="well-label" for="param-safety-input">Sicherheitszuschlag</label>
            </div>
            <div class="stepper-row">
              <button type="button" class="step-btn press-btn" id="param-safety-minus" aria-label="Sicherheitszuschlag verringern">−</button>
              <div class="num-value-wrap">
                <input id="param-safety-input" class="num-input" type="number" inputmode="decimal" step="0.1" min="0" max="1.0" value="0.3" aria-label="Sicherheitszuschlag in bar" />
                <span class="num-unit">bar</span>
              </div>
              <button type="button" class="step-btn press-btn" id="param-safety-plus" aria-label="Sicherheitszuschlag erhöhen">+</button>
            </div>
          </div>

          <div class="well">
            <div class="well-header">
              <label class="well-label" for="param-p0min-input">Mindest-Vordruck p₀</label>
            </div>
            <div class="stepper-row">
              <button type="button" class="step-btn press-btn" id="param-p0min-minus" aria-label="Mindest-Vordruck verringern">−</button>
              <div class="num-value-wrap">
                <input id="param-p0min-input" class="num-input" type="number" inputmode="decimal" step="0.1" min="0.5" max="1.5" value="0.8" aria-label="Mindest-Vordruck in bar" />
                <span class="num-unit">bar</span>
              </div>
              <button type="button" class="step-btn press-btn" id="param-p0min-plus" aria-label="Mindest-Vordruck erhöhen">+</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="toast-pill" class="toast-pill" role="status" aria-live="polite" data-visible="false"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
