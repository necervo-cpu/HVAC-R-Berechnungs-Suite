<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="Luftkanal" />
    <title>Luftkanal &amp; RLT · HVAC·R Rechner</title>
    <link rel="icon" type="image/svg+xml" href="../../icon.svg" />
    <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="agFonts"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0..200&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0..200&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      (function () {
        var root = document.documentElement;
        var savedTheme = null;
        try {
          savedTheme = localStorage.getItem("ag-theme");
        } catch (e) {}
        var systemPrefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
        var activeTheme =
          savedTheme === "light" || savedTheme === "dark" ? savedTheme : systemPrefersLight ? "light" : "dark";
        root.setAttribute("data-theme", activeTheme);
      })();
    </script>
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <script>
      (function () {
        var root = document.documentElement, link = document.getElementById("agFonts");
        if (!link || !document.fonts || !document.fonts.load) return;
        var done = function () { root.classList.remove("icons-pending"); };
        root.classList.add("icons-pending");
        setTimeout(done, 4000);
        link.addEventListener("load", function () {
          setTimeout(function () { document.fonts.load('24px "Material Symbols Rounded"').then(done, done); }, 0);
        });
        link.addEventListener("error", done);
      })();
    </script>
    <script type="module" src="../../assets/js/shared.js"></script>
  </head>
  <body>
    <div class="ambient-canvas" aria-hidden="true"></div>

    <main class="app-shell app-shell--narrow app-shell--split">
      <div class="app-topbar">
        <a href="../../index.html" id="nav-home-link" class="back-btn">
          <span class="material-symbols-rounded" aria-hidden="true">chevron_left</span>Übersicht
        </a>
        <div class="top-actions">
          <button type="button" id="reset-calc-btn" class="icon-btn" aria-label="Eingaben zurücksetzen" title="Zurücksetzen">
            <span class="material-symbols-rounded" aria-hidden="true">restart_alt</span>
          </button>
          <button type="button" id="themeToggleBtn" class="icon-btn" aria-label="Erscheinungsbild wechseln" title="Hell oder Dunkel wechseln">
            <span class="material-symbols-rounded" id="themeToggleIcon" aria-hidden="true">light_mode</span>
          </button>
          <button type="button" id="settings-toggle-btn" class="icon-btn" aria-label="Einstellungen öffnen" title="Einstellungen">
            <span class="material-symbols-rounded" aria-hidden="true">settings</span>
          </button>
        </div>
      </div>

      <header class="app-header">
        <div class="app-header-text">
          <h1 class="brand-title" id="brand-title">Luftkanal</h1>
          <p class="brand-subtitle">Kanalgeschwindigkeit, Luftwechsel und Luftleistung</p>
        </div>
      </header>

      <div id="view-calc" class="split">
        <div class="segmented-control" id="mode-tabs" role="group" aria-label="Berechnungsmodus">
          <button type="button" class="segmented-option" data-mode="duct" aria-pressed="true">Kanal und v</button>
          <button type="button" class="segmented-option" data-mode="room" aria-pressed="false">Luftwechsel und Q̇</button>
        </div>

        <div class="split-aside">
        <section class="hero" aria-live="polite" aria-label="Ergebnis">
          <div class="hero-caption" id="result-label">Luftgeschwindigkeit v</div>
          <div class="hero-value numeric" id="result-main"><span id="result-number">–</span> <span id="result-unit" class="metric-unit">m/s</span></div>
          <span class="status-pill status-pill--green" id="result-badge" data-state="ok"><span class="status-dot"></span><span id="result-badge-text">Leise</span></span>
        </section>

        <div class="info-list" id="result-rows" style="margin-bottom: 1.5rem"></div>
        </div>

        <section class="glass-card" aria-label="Luftkanal-Berechnung">
        <div class="control">
          <div class="control-head">
            <label class="control-label" for="air-flow-input">Luftvolumenstrom V̇</label>
            <input id="air-flow-input" class="value-input numeric" type="text" inputmode="decimal" autocomplete="off" value="400" aria-label="Luftvolumenstrom in Kubikmetern pro Stunde" />
            <span class="input-unit-addon">m³/h</span>
          </div>
          <div class="control-slide">
            <button type="button" class="stepper" id="air-flow-minus" aria-label="Luftvolumenstrom V̇ verringern"><span class="material-symbols-rounded" aria-hidden="true">remove</span></button>
            <input type="range" id="air-flow-input-range" min="0" max="5000" step="50" value="400" aria-label="Luftvolumenstrom V̇ Schieberegler" />
            <button type="button" class="stepper" id="air-flow-plus" aria-label="Luftvolumenstrom V̇ erhöhen"><span class="material-symbols-rounded" aria-hidden="true">add</span></button>
          </div>
        </div>

          <div id="panel-duct">
            <div class="segmented-control" id="duct-shape-tabs" role="group" aria-label="Kanalform">
              <button type="button" class="segmented-option" data-shape="round" aria-pressed="true">Rundrohr</button>
              <button type="button" class="segmented-option" data-shape="rect" aria-pressed="false">Rechteckkanal</button>
            </div>

            <div id="duct-round-well">
              <div class="card-title" style="margin: 1rem 0 0.5rem">Wickelfalzrohr Nennweite</div>
              <div class="tab-strip" id="dn-group" role="tablist" aria-label="Rundrohr Durchmesser">
            <button type="button" class="tab-pill" role="tab" data-dn="100" aria-selected="false">DN 100</button>
            <button type="button" class="tab-pill" role="tab" data-dn="125" aria-selected="false">DN 125</button>
            <button type="button" class="tab-pill" role="tab" data-dn="160" aria-selected="false">DN 160</button>
            <button type="button" class="tab-pill" role="tab" data-dn="200" aria-selected="true">DN 200</button>
            <button type="button" class="tab-pill" role="tab" data-dn="250" aria-selected="false">DN 250</button>
            <button type="button" class="tab-pill" role="tab" data-dn="315" aria-selected="false">DN 315</button>
            <button type="button" class="tab-pill" role="tab" data-dn="400" aria-selected="false">DN 400</button>
            <button type="button" class="tab-pill" role="tab" data-dn="500" aria-selected="false">DN 500</button>
              </div>
            </div>

            <div id="duct-rect-well" hidden>
        <div class="control">
          <div class="control-head">
            <label class="control-label" for="rect-w-input">Breite B</label>
            <input id="rect-w-input" class="value-input numeric" type="text" inputmode="decimal" autocomplete="off" value="300" aria-label="Kanalbreite in Millimetern" />
            <span class="input-unit-addon">mm</span>
          </div>
          <div class="control-slide">
            <button type="button" class="stepper" id="rect-w-minus" aria-label="Breite B verringern"><span class="material-symbols-rounded" aria-hidden="true">remove</span></button>
            <input type="range" id="rect-w-input-range" min="50" max="2000" step="50" value="300" aria-label="Breite B Schieberegler" />
            <button type="button" class="stepper" id="rect-w-plus" aria-label="Breite B erhöhen"><span class="material-symbols-rounded" aria-hidden="true">add</span></button>
          </div>
        </div>

        <div class="control">
          <div class="control-head">
            <label class="control-label" for="rect-h-input">Höhe H</label>
            <input id="rect-h-input" class="value-input numeric" type="text" inputmode="decimal" autocomplete="off" value="150" aria-label="Kanalhöhe in Millimetern" />
            <span class="input-unit-addon">mm</span>
          </div>
          <div class="control-slide">
            <button type="button" class="stepper" id="rect-h-minus" aria-label="Höhe H verringern"><span class="material-symbols-rounded" aria-hidden="true">remove</span></button>
            <input type="range" id="rect-h-input-range" min="50" max="2000" step="50" value="150" aria-label="Höhe H Schieberegler" />
            <button type="button" class="stepper" id="rect-h-plus" aria-label="Höhe H erhöhen"><span class="material-symbols-rounded" aria-hidden="true">add</span></button>
          </div>
        </div>

            </div>
          </div>

          <div id="panel-room" hidden>
        <div class="control">
          <div class="control-head">
            <label class="control-label" for="room-vol-input">Raumvolumen</label>
            <input id="room-vol-input" class="value-input numeric" type="text" inputmode="decimal" autocomplete="off" value="120" aria-label="Raumvolumen in Kubikmetern" />
            <span class="input-unit-addon">m³</span>
          </div>
          <div class="control-slide">
            <button type="button" class="stepper" id="room-vol-minus" aria-label="Raumvolumen verringern"><span class="material-symbols-rounded" aria-hidden="true">remove</span></button>
            <input type="range" id="room-vol-input-range" min="1" max="2000" step="10" value="120" aria-label="Raumvolumen Schieberegler" />
            <button type="button" class="stepper" id="room-vol-plus" aria-label="Raumvolumen erhöhen"><span class="material-symbols-rounded" aria-hidden="true">add</span></button>
          </div>
        </div>

        <div class="control">
          <div class="control-head">
            <label class="control-label" for="air-dt-input">Temperaturdifferenz ΔT</label>
            <input id="air-dt-input" class="value-input numeric" type="text" inputmode="decimal" autocomplete="off" value="8" aria-label="Temperaturdifferenz in Kelvin" />
            <span class="input-unit-addon">K</span>
          </div>
          <div class="control-slide">
            <button type="button" class="stepper" id="air-dt-minus" aria-label="Temperaturdifferenz ΔT verringern"><span class="material-symbols-rounded" aria-hidden="true">remove</span></button>
            <input type="range" id="air-dt-input-range" min="0" max="60" step="1" value="8" aria-label="Temperaturdifferenz ΔT Schieberegler" />
            <button type="button" class="stepper" id="air-dt-plus" aria-label="Temperaturdifferenz ΔT erhöhen"><span class="material-symbols-rounded" aria-hidden="true">add</span></button>
          </div>
        </div>

          </div>
        </section>


        <p class="hint numeric" id="formula-hint" style="margin-top: 1rem">v = V̇ / A, A = π · d² / 4, d_eq = 1,3 · (B · H)^0,625 / (B + H)^0,25</p>
      </div>
    </main>

    <div class="modal-overlay" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="liquid-glass modal-card">
        <div class="modal-head">
          <h2 class="modal-title" id="settingsTitle">Einstellungen</h2>
          <button type="button" class="icon-btn" id="settingsCloseBtn" aria-label="Schließen">
            <span class="material-symbols-rounded" aria-hidden="true">close</span>
          </button>
        </div>

        <div>
          <div class="card-title" style="margin-bottom: 0.5rem">Darstellung</div>
          <div class="segmented-control" id="theme-mode-group" role="group" aria-label="Darstellung">
            <button type="button" class="segmented-option" data-theme-mode="light" aria-pressed="false">Hell</button>
            <button type="button" class="segmented-option" data-theme-mode="dark" aria-pressed="false">Dunkel</button>
            <button type="button" class="segmented-option" data-theme-mode="auto" aria-pressed="true">System</button>
          </div>
        </div>

        <div>
          <div class="card-title">Rechenwerte</div>
        <div class="control">
          <div class="control-head">
            <label class="control-label" for="param-air-rho-input">Luftdichte ρ</label>
            <input id="param-air-rho-input" class="value-input numeric" type="text" inputmode="decimal" autocomplete="off" value="1.204" aria-label="Luftdichte in Kilogramm pro Kubikmeter" />
            <span class="input-unit-addon">kg/m³</span>
          </div>
          <div class="control-slide">
            <button type="button" class="stepper" id="param-air-rho-minus" aria-label="Luftdichte ρ verringern"><span class="material-symbols-rounded" aria-hidden="true">remove</span></button>
            <input type="range" id="param-air-rho-input-range" min="0.9" max="1.4" step="0.01" value="1.204" aria-label="Luftdichte ρ Schieberegler" />
            <button type="button" class="stepper" id="param-air-rho-plus" aria-label="Luftdichte ρ erhöhen"><span class="material-symbols-rounded" aria-hidden="true">add</span></button>
          </div>
        </div>

        <div class="control">
          <div class="control-head">
            <label class="control-label" for="param-vquiet-input">Grenze „Leise“</label>
            <input id="param-vquiet-input" class="value-input numeric" type="text" inputmode="decimal" autocomplete="off" value="4" aria-label="Maximale leise Kanalgeschwindigkeit in Metern pro Sekunde" />
            <span class="input-unit-addon">m/s</span>
          </div>
          <div class="control-slide">
            <button type="button" class="stepper" id="param-vquiet-minus" aria-label="Grenze „Leise“ verringern"><span class="material-symbols-rounded" aria-hidden="true">remove</span></button>
            <input type="range" id="param-vquiet-input-range" min="2" max="8" step="0.5" value="4" aria-label="Grenze „Leise“ Schieberegler" />
            <button type="button" class="stepper" id="param-vquiet-plus" aria-label="Grenze „Leise“ erhöhen"><span class="material-symbols-rounded" aria-hidden="true">add</span></button>
          </div>
        </div>

        </div>
      </div>
    </div>

    <div id="toast-pill" class="toast-pill" role="status" aria-live="polite"><span class="material-symbols-rounded" aria-hidden="true">check_circle</span><span id="toast-text"></span></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
